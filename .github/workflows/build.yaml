name: README build

on:
  schedule:
    - cron: '0 4 * * *'

permissions:
  contents: write

concurrency:
  group: profile-readme
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Update README and terminal images
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/prepare-readme.mjs
      - name: Commit generated README and images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- README.md dark_mode.svg light_mode.svg assets/profile
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "docs: regenerate terminal profile"
          git push
